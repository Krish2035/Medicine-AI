<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="#0b0f19" />
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" />
  
  <!-- Circular Glow -->
  <circle cx="96" cy="96" r="62" fill="rgba(16, 185, 129, 0.12)" filter="url(#pwaGlow)" />
  
  <!-- Medical Cross & Pulse Wave -->
  <g fill="none" stroke="url(#pwaGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pulse wave path across cross -->
    <path d="M42 96 h24 l14 -32 l24 64 l18 -42 l12 10 h16" />
  </g>
  
  <!-- Subtle Medical Plus Accents -->
  <path d="M96 46 v18 M87 55 h18" stroke="#34d399" stroke-width="5" stroke-linecap="round" />
  <circle cx="150" cy="46" r="5" fill="#06b6d4" />
</svg>
